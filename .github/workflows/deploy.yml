name: Deploy to Digital Ocean

on:
  push:
    branches:
      - main
    paths:
      - 'pdf-maker/**'
      - 'newsletter2paper/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Digital Ocean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            
            echo "📦 Navigating to project directory..."
            cd ~/newsletter2paper
            
            echo "🔄 Pulling latest changes from GitHub..."
            git pull origin main
            
            echo "🧹 Pruning dangling images and old build cache before build..."
            docker image prune -f || true
            docker builder prune -f --filter until=72h || true
            df -h /

            echo "🛑 Stopping containers..."
            docker compose down
            
            echo "🏗️ Rebuilding and starting containers..."
            docker compose up -d --build
            
            echo "⏳ Waiting for services to be ready..."
            sleep 15
            
            echo "🔍 Checking container status..."
            docker compose ps
            
            echo "✅ Testing API health endpoint..."
            max_attempts=5
            attempt=0
            while [ $attempt -lt $max_attempts ]; do
              if curl -f -s http://localhost:8000/health | grep -q "healthy"; then
                echo "✅ Health check passed!"
                curl http://localhost:8000/health
                break
              else
                attempt=$((attempt + 1))
                echo "⏳ Health check attempt $attempt/$max_attempts failed, retrying in 3s..."
                sleep 3
              fi
            done
            
            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Health check failed after $max_attempts attempts"
              echo "📋 API Logs:"
              docker compose logs --tail=100 newsletter2paper-api
              exit 1
            fi
            
            echo "🎉 Deployment complete!"

            echo "🧹 Pruning images left behind by this build..."
            docker image prune -f || true
            df -h /

            echo "📋 Recent logs:"
            docker compose logs --tail=50
      
      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above for details."
