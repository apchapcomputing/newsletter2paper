name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review at a time per PR; a new push cancels the stale run.
concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review pull request
    # Skip drafts, and PRs from forks (they cannot read repo secrets).
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first for the architecture
            and commands, and check the change against the relevant spec in
            openspec/specs/<domain>/spec.md.

            Focus on:
            - Correctness bugs, especially in the scheduler (services/scheduler.py),
              email delivery, and the FastAPI -> Go `docker exec` bridge.
            - Security: secrets in code, missing auth or RLS checks, unsafe SQL,
              and anything that exposes user data or article text.
            - Behavior changes without a matching update to openspec/specs/ or tests.
            - Migrations in data/migrations/ that are unsafe to apply by hand
              (no migration runner exists).
            - UI regressions in ui/ (Next.js App Router, MUI).

            Ignore style nits that the linters already catch. Leave inline
            comments on specific lines for real issues, then post one short
            summary comment. If nothing is wrong, say so in a single sentence.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
