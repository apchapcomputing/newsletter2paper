name: Test DB Migrations

on:
  pull_request:
    paths:
      - 'newsletter2paper/supabase/migrations/**'
      - 'newsletter2paper/supabase/tests/**'
      - 'newsletter2paper/services/delivery_store.py'
      - 'newsletter2paper/tests/integration/test_delivery_store_pg.py'
      - 'data/migrations/**'
      - '.github/workflows/test-db-migrations.yml'

jobs:
  test-migrations:
    name: Apply migrations to local Supabase
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: newsletter2paper

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase CLI
        run: npm install

      - name: Check supabase/migrations and data/migrations are in sync
        working-directory: .
        run: |
          status=0
          for f in newsletter2paper/supabase/migrations/*.sql; do
            name=$(basename "$f")
            # The baseline mirrors data/create-tables.sql, not data/migrations/
            if [[ "$name" == *_baseline_schema.sql ]]; then
              if ! diff -q "$f" data/create-tables.sql > /dev/null; then
                echo "::error file=$f::Differs from data/create-tables.sql"
                status=1
              fi
              continue
            fi
            ts=${name%%_*}
            desc=${name#*_}
            mirror="data/migrations/${ts:0:4}_${ts:4:2}_${ts:6:2}_${desc}"
            if [ ! -f "$mirror" ]; then
              echo "::error file=$f::Missing mirror $mirror"
              status=1
            elif ! diff -q "$f" "$mirror" > /dev/null; then
              echo "::error file=$f::Differs from $mirror"
              status=1
            fi
          done
          exit $status

      - name: Migration versions are unique and newer than everything on the base branch
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # `supabase db push` refuses to apply a migration older than the newest one already on
          # production ("found local migration files to be inserted before the last migration").
          # Production gets everything on main, so a new file must sort after every file on main.
          dir=newsletter2paper/supabase/migrations
          status=0
          dups=$(ls "$dir" | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dups" ]; then echo "::error::Duplicate migration versions: $dups"; status=1; fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          latest=$(git ls-tree --name-only FETCH_HEAD "$dir/" | xargs -n1 basename | cut -d_ -f1 | sort | tail -1)
          # Renames (-M) are not additions: renumbering a not-yet-applied migration is how an out-of-order one is fixed.
          for f in $(git diff -M --name-only --diff-filter=A FETCH_HEAD HEAD -- "$dir"); do
            ver=$(basename "$f" | cut -d_ -f1)
            if [ "$ver" -le "$latest" ]; then
              echo "::error file=$f::Version $ver must be greater than the latest migration on $BASE_REF ($latest). Rename the file with a newer timestamp."
              status=1
            fi
          done
          exit $status

      - name: Start local Postgres and apply migrations
        run: npx supabase db start

      - name: Reset database (replay all migrations from scratch)
        run: npx supabase db reset

      - name: Re-apply each migration (idempotency)
        run: |
          container=$(docker ps --format '{{.Names}}' | grep supabase_db | head -n 1)
          for f in supabase/migrations/*.sql; do
            echo "Re-applying $f"
            docker exec -i "$container" psql -U postgres -v ON_ERROR_STOP=1 < "$f"
          done

      - name: Run RLS policy tests
        run: |
          container=$(docker ps --format '{{.Names}}' | grep supabase_db | head -n 1)
          docker exec -i "$container" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/rls_policies.sql

      - name: Run user_issues foreign key tests
        run: |
          container=$(docker ps --format '{{.Names}}' | grep supabase_db | head -n 1)
          docker exec -i "$container" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/user_issues_fk.sql

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: newsletter2paper/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run scheduler database tests (claims, fencing, period index, triggers)
        env:
          SCHEDULER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pytest tests/integration/test_delivery_store_pg.py -p no:cacheprovider

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
