services:
  # FastAPI Service
  fastapi:
    build:
      context: ./newsletter2paper
      dockerfile: Dockerfile
    container_name: newsletter2paper-api
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL}
      - GO_PDF_CONTAINER=pdf-maker
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
    volumes:
      - ./shared:/shared
      - ./newsletter2paper:/app
      - /var/run/docker.sock:/var/run/docker.sock # Allow docker exec
    depends_on:
      - pdf-maker
    networks:
      - newsletter-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # Go PDF Maker Service
  pdf-maker:
    build:
      context: ./pdf-maker
      dockerfile: Dockerfile
    container_name: pdf-maker
    volumes:
      - ./shared:/shared
      - shared-images:/app/images
    networks:
      - newsletter-network
    # Keep container running so FastAPI can docker exec into it
    # Override user to run as root to avoid permission issues with /shared volume
    user: root
    entrypoint: []
    command: tail -f /dev/null
    restart: unless-stopped

  # Telegram bot
  telegram-bot:
    build:
      context: ./bot/telegram
      dockerfile: Dockerfile
    container_name: newsletter-telegram-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - FASTAPI_BASE_URL=http://fastapi:8000
    depends_on:
      - fastapi
    networks:
      - newsletter-network
    restart: unless-stopped

  # Discord bot
  discord-bot:
    build:
      context: ./bot/discord
      dockerfile: Dockerfile
    container_name: newsletter-discord-bot
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - FASTAPI_BASE_URL=http://fastapi:8000
    depends_on:
      - fastapi
    networks:
      - newsletter-network
    restart: unless-stopped

  # Signal CLI REST API bridge
  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: newsletter-signal-cli
    environment:
      - MODE=json-rpc
    volumes:
      - signal-data:/home/.local/share/signal-cli
    networks:
      - newsletter-network
    restart: unless-stopped

  # Signal bot (polls signal-cli bridge)
  signal-bot:
    build:
      context: ./bot/signal
      dockerfile: Dockerfile
    container_name: newsletter-signal-bot
    environment:
      - SIGNAL_NUMBER=${SIGNAL_NUMBER}
      - SIGNAL_CLI_URL=http://signal-cli:8080
      - FASTAPI_BASE_URL=http://fastapi:8000
    depends_on:
      - signal-cli
      - fastapi
    networks:
      - newsletter-network
    restart: unless-stopped

volumes:
  shared-images:
    driver: local
  signal-data:
    driver: local

networks:
  newsletter-network:
    driver: bridge
