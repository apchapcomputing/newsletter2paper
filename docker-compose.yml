services:
  # FastAPI Service
  fastapi:
    build:
      context: ./newsletter2paper
      dockerfile: Dockerfile
    container_name: newsletter2paper-api
    # Localhost only: Docker publishes ports straight past ufw, so "8000:8000" would expose the
    # plain-HTTP API to the internet. The public entry point is the caddy service below, which
    # terminates HTTPS. (The deploy health check runs on the droplet, so it still reaches this.)
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL}
      - GO_PDF_CONTAINER=pdf-maker
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://eu.i.posthog.com}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      # Scheduler tuning. The defaults match the code; see .env.example before changing them.
      - SCHEDULER_LOCK_TIMEOUT_MINUTES=${SCHEDULER_LOCK_TIMEOUT_MINUTES:-15}
      - SCHEDULER_MAX_ATTEMPTS=${SCHEDULER_MAX_ATTEMPTS:-5}
      - SCHEDULER_RSS_BUDGET_SECONDS=${SCHEDULER_RSS_BUDGET_SECONDS:-300}
      - SCHEDULER_SHUTDOWN_GRACE_SECONDS=${SCHEDULER_SHUTDOWN_GRACE_SECONDS:-100}
      - SEND_NOW_COOLDOWN_MINUTES=${SEND_NOW_COOLDOWN_MINUTES:-10}
    volumes:
      - ./shared:/shared
      - ./newsletter2paper:/app
      - /var/run/docker.sock:/var/run/docker.sock # Allow docker exec
    depends_on:
      - pdf-maker
    networks:
      - newsletter-network
    # No --reload in production: a file change restarts the process, which would cut a scheduled
    # run short. (docker-compose.dev.yml keeps it.)
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    # On stop, the scheduler waits up to SCHEDULER_SHUTDOWN_GRACE_SECONDS (default 100) for the
    # run in progress; Docker must not SIGKILL it first.
    stop_grace_period: 120s
    restart: unless-stopped

  # HTTPS reverse proxy: gets and renews a Let's Encrypt certificate for API_DOMAIN and forwards
  # to the API. Needs a DNS A record for API_DOMAIN pointing at this droplet, and ports 80 and 443
  # open. Certificates live in the caddy_data volume; do not run `docker compose down -v`.
  caddy:
    image: caddy:2-alpine
    container_name: newsletter2paper-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Falls back to localhost (a self-signed certificate nobody uses) so a missing value cannot
      # stop the API from starting.
      - API_DOMAIN=${API_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fastapi
    networks:
      - newsletter-network
    restart: unless-stopped

  # Go PDF Maker Service
  pdf-maker:
    build:
      context: ./pdf-maker
      dockerfile: Dockerfile
    container_name: pdf-maker
    volumes:
      - ./shared:/shared
      - shared-images:/app/images
    networks:
      - newsletter-network
    # Keep container running so FastAPI can docker exec into it
    # Override user to run as root to avoid permission issues with /shared volume
    user: root
    entrypoint: []
    command: tail -f /dev/null
    restart: unless-stopped

volumes:
  shared-images:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  newsletter-network:
    driver: bridge
