services:
  # FastAPI Service
  fastapi:
    build:
      context: ./newsletter2paper
      dockerfile: Dockerfile
    container_name: newsletter2paper-api
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL}
      - GO_PDF_CONTAINER=pdf-maker
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://eu.i.posthog.com}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-}
    volumes:
      - ./shared:/shared
      - ./newsletter2paper:/app
      - /var/run/docker.sock:/var/run/docker.sock # Allow docker exec
    depends_on:
      - pdf-maker
    networks:
      - newsletter-network
    # No --reload in production: a file change restarts the process, which would cut a scheduled
    # run short. (docker-compose.dev.yml keeps it.)
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    # On stop, the scheduler waits up to SCHEDULER_SHUTDOWN_GRACE_SECONDS (default 100) for the
    # run in progress; Docker must not SIGKILL it first.
    stop_grace_period: 120s
    restart: unless-stopped

  # Go PDF Maker Service
  pdf-maker:
    build:
      context: ./pdf-maker
      dockerfile: Dockerfile
    container_name: pdf-maker
    volumes:
      - ./shared:/shared
      - shared-images:/app/images
    networks:
      - newsletter-network
    # Keep container running so FastAPI can docker exec into it
    # Override user to run as root to avoid permission issues with /shared volume
    user: root
    entrypoint: []
    command: tail -f /dev/null
    restart: unless-stopped

volumes:
  shared-images:
    driver: local

networks:
  newsletter-network:
    driver: bridge
